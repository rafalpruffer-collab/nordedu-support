name: Zbuduj NordEdu Support

# Uruchamiane recznie: zakladka "Actions" -> "Zbuduj NordEdu Support" -> "Run workflow".
# Pobiera oryginalny kod Veyon 4.11.4, nakłada zmiany Nordweco (nordedu-support.patch)
# i buduje instalator Windows 64-bit oraz paczke ze zrodlami (wymog licencji GPL).
# Budowanie odbywa sie na Windows z gotowymi pakietami MSYS2 (MinGW-w64 + Qt 6).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Wylacz zamiane koncow linii (Windows psuje plik .patch)
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Zainstaluj narzedzia budowania (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git tar patch dos2unix make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-httpserver
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib

      - name: Zbuduj biblioteke QCA (szyfrowanie, brak gotowego pakietu MSYS2)
        run: |
          git clone --depth 1 --branch v2.3.10 https://github.com/KDE/qca.git qca-src
          cmake -S qca-src -B qca-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_PLUGINS=ossl \
            -DQCA_PLUGINS_INSTALL_DIR=/mingw64/lib/qca-qt6/crypto
          cmake --build qca-build
          cmake --install qca-build
          p=$(find /mingw64 qca-build -name '*qca-ossl*.dll' | head -1); echo "Wtyczka: $p"; mkdir -p /mingw64/lib/qca-qt6/crypto; [ "$p" -ef /mingw64/lib/qca-qt6/crypto/libqca-ossl.dll ] || cp "$p" /mingw64/lib/qca-qt6/crypto/libqca-ossl.dll; ls -la /mingw64/bin/libqca-qt6.dll /mingw64/lib/qca-qt6/crypto/

      - name: Zbuduj biblioteke Interception (blokowanie klawiatury i myszy)
        run: |
          git clone --depth 1 https://github.com/oblitum/Interception.git interception-src
          cd interception-src/library
          gcc -shared -O2 -DINTERCEPTION_EXPORT interception.c -o interception.dll -Wl,--out-implib,libinterception.dll.a -lsetupapi
          cp interception.h /mingw64/include/
          cp interception.dll /mingw64/bin/
          cp libinterception.dll.a /mingw64/lib/
          ls -la /mingw64/bin/interception.dll

      - name: Pobierz kod zrodlowy Veyon 4.11.4
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/veyon/veyon.git veyon-src
          cd veyon-src
          git checkout v4.11.4
          git submodule update --init --recursive

      - name: Naloz zmiany NordEdu Support
        run: |
          cd veyon-src
          git apply --binary ../nordedu-support.patch

      - name: Przygotuj paczke ze zrodlami (GPL) - przed budowaniem
        run: |
          mkdir -p wynik
          cp nordedu-support.patch wynik/
          tar --exclude-vcs -czf wynik/NordEdu-Support-4.11.4-zrodla.tar.gz veyon-src nordedu-support.patch COPYING

      - name: Dostosuj skrypty pakujace Veyon do ukladu MSYS2
        run: |
          cd veyon-src
          sh .ci/common/strip-ultravnc-sources.sh
          # wtyczka LDAP (import z Active Directory) pomijana - brak bibliotek OpenLDAP w MSYS2
          rm -rf plugins/ldap
          # narzedzie "todos" (konwersja koncow linii) zastepuje unix2dos
          printf '#!/bin/sh\nexec unix2dos "$@"\n' > /usr/bin/todos
          chmod +x /usr/bin/todos
          # natywna kompilacja na Windows zglasza architekture AMD64
          sed -i 's/CMAKE_SYSTEM_PROCESSOR STREQUAL "x86_64"/CMAKE_SYSTEM_PROCESSOR MATCHES "x86_64|AMD64"/' CMakeLists.txt
          # nowszy kompilator MSYS2: ostrzezenia nie moga przerywac budowania
          sed -i 's/;-Werror//' cmake/modules/SetDefaultTargetProperties.cmake
          # makro UNICODE wybieralo wersje "wide" funkcji Windows w bibliotece VNC
          sed -i 's/GetComputerName(/GetComputerNameA(/' 3rdparty/libvncserver/src/libvncserver/main.c
          # lupdate dostaje tysiace nazw plikow naraz - Windows ma limit dlugosci polecenia.
          # Zamiast odswiezac pliki .ts, tylko je "dotykamy" (tlumaczenie zostaje bez zmian).
          sed -i 's|COMMAND Qt${QT_MAJOR_VERSION}::lupdate.*|COMMAND ${CMAKE_COMMAND} -E touch ${ts_file}|' cmake/modules/CreateTranslations.cmake
          grep -n "touch" cmake/modules/CreateTranslations.cmake
          grep -n "Werror" cmake/modules/SetDefaultTargetProperties.cmake || true
          grep -n "GetComputerName" 3rdparty/libvncserver/src/libvncserver/main.c
          f=cmake/modules/WindowsInstaller.cmake
          sed -i \
            -e 's|^set(DLLDIR_GCC .*|set(DLLDIR_GCC "${MINGW_PREFIX}/bin")|' \
            -e 's|${DLLDIR_LIB}/zlib1.dll|${DLLDIR}/zlib1.dll|' \
            -e 's|${DLLDIR_LIB}/libwinpthread-1.dll|${DLLDIR}/libwinpthread-1.dll|' \
            -e 's|${MINGW_PREFIX}/plugins|${MINGW_PREFIX}/share/qt6/plugins|g' \
            -e 's|libjpeg-62\.dll|libjpeg-*.dll|' \
            -e '/libsasl2-3\.dll/d' \
            -e '/libldap\.dll/d' -e '/libssp-0\.dll/d' -e 's|COMMAND makensis ${WINDOWS_INSTALL_FILES}/veyon.nsi|COMMAND ${CMAKE_COMMAND} -E chdir ${WINDOWS_INSTALL_FILES} makensis veyon.nsi|' \
            -e '/libvncserver\.dll/d' \
            -e '/plugins\/lib\*\.dll/d' \
            -e 's|^.*vnchooks\.dll.*|\tCOMMAND find plugins -name vnchooks.dll -exec cp -t ${WINDOWS_INSTALL_FILES}/ {} +\n\tCOMMAND rm -f ${WINDOWS_INSTALL_FILES}/plugins/vnchooks.dll|' \
            -e 's|^.*libvncclient\.dll.*|\tCOMMAND find 3rdparty -name "libvnc*.dll" -exec cp -t ${WINDOWS_INSTALL_FILES}/ {} +|' \
            $f
          grep -n "DLLDIR_GCC\|zlib1\|winpthread\|share/qt6\|interception" $f

      - name: Skonfiguruj budowanie
        run: |
          cmake -S veyon-src -B build -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DMINGW_PREFIX=/mingw64 \
            -DMINGW_TARGET=x86_64-w64-mingw32 \
            -DMINGW_TOOL_PREFIX=/mingw64/bin/ \
            -DWITH_BUNDLED_LIBVNC=ON \
            -DWITH_TESTS=OFF \
            -DWITH_LTO=OFF \
            -DWITH_UNITY_BUILD=OFF

      - name: Sprawdz czy sa wszystkie potrzebne pliki
        run: |
          for f in libjpeg-*.dll libpng16-16.dll libcrypto-3*.dll libssl-3*.dll libqca-qt6.dll liblzo2-2.dll interception.dll zlib1.dll libwinpthread-1.dll libstdc++-6.dll libssp-0.dll libgcc_s_seh-1.dll Qt6Core.dll Qt6Core5Compat.dll Qt6Gui.dll Qt6Widgets.dll Qt6Network.dll Qt6Concurrent.dll Qt6HttpServer.dll Qt6WebSockets.dll; do
            ls /mingw64/bin/$f > /dev/null 2>&1 && echo "OK   $f" || echo "BRAK $f"
          done
          ls /mingw64/share/qt6/plugins/imageformats/qjpeg.dll /mingw64/share/qt6/plugins/platforms/qwindows.dll /mingw64/share/qt6/plugins/tls/qopensslbackend.dll || true
          ls /mingw64/share/qt6/plugins/styles || true
          ls /mingw64/lib/qca-qt6/crypto || true

      - name: Zbuduj instalator Windows 64-bit
        run: |
          cd build
          cmake --build . -j4
          cmake --build . --target create-windows-installer
          ls -la veyon-*setup.exe
          mkdir -p ../wynik
          cp veyon-*setup.exe ../wynik/NordEdu-Support-4.11.4-win64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: NordEdu-Support
          path: wynik/*
          if-no-files-found: error
